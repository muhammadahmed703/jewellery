<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — House of Sheikh</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/index.html" class="brand">
        <div class="brand-mark">S</div>
        <div class="brand-name">House of Sheikh<small>Jewels &amp; Accessories</small></div>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/shop.html" class="active">Shop</a></li>
      </ul>
      <div class="nav-actions">
        <button class="cart-btn" onclick="openCart()">🛍<span class="cart-badge" id="cartBadge">0</span></button>
        <button class="hamburger" id="hamburger">☰</button>
      </div>
    </div>
  </nav>

  <main class="container detail-wrap">
    <div class="detail-gallery reveal visible">
      <div class="gallery-main"><img id="mainImg" src="" alt="Product" /></div>
      <div class="gallery-thumbs" id="galleryThumbs"></div>
    </div>

    <div class="detail-info reveal visible">
      <span class="prod-cat" id="pCat"></span>
      <h1 id="pTitle"></h1>
      <div class="detail-price" id="pPrice"></div>
      <span class="stock-pill" id="pStock"></span>
      <p class="detail-desc" id="pDesc"></p>
      <table class="spec-table">
        <tr><td>Category</td><td id="specCat"></td></tr>
        <tr><td>Item Code</td><td id="specSku"></td></tr>
        <tr><td>Availability</td><td id="specAvail"></td></tr>
        <tr><td>Shipping</td><td> Nationwide — Cash on Delivery</td></tr>
      </table>
      <div class="qty-row">
        <div class="qty-box">
          <button onclick="changeQty(-1)">−</button>
          <span id="qtyVal">1</span>
          <button onclick="changeQty(1)">+</button>
        </div>
        <button class="btn btn-dark" onclick="addDetailToCart()">🛍 Add to Cart</button>
        <button class="btn btn-gold" onclick="buyNow()">⚡ Buy Now</button>
      </div>
    </div>
  </main>

  <section class="section container" style="padding-top:20px">
    <div class="sec-head">
      <div class="eyebrow">You May Also Like</div>
      <h2>Related <span class="gold-text">Pieces</span></h2>
      <div class="line"></div>
    </div>
    <div class="prod-grid" id="relatedGrid"></div>
  </section>

  <footer>
    <div class="foot-bottom">© 2025 House of Sheikh — Jewels &amp; Accessories. All rights reserved.</div>
  </footer>

  <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-head"><h3>Your Bag 👑</h3><button onclick="closeCart()">✕</button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="cart-total"><span>Subtotal</span><strong id="cartTotal">Rs 0</strong></div>
      <a href="/checkout.html" class="btn btn-gold w-full">Proceed to Checkout</a>
    </div>
  </aside>

  <div class="toast" id="toast"></div>
  <script src="/js/main.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
